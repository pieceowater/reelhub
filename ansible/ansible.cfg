# Picked up automatically when ansible-playbook runs from this directory,
# so `ansible-playbook deploy.yml` works without repeating -i every time.
[defaults]
inventory = inventory.ini
# The playbook only touches localhost over HTTP APIs; the cowsay banner and
# per-task deprecation noise add nothing here.
nocows = True
deprecation_warnings = False
# Show which tasks actually changed something, in a readable layout.
stdout_callback = yaml
# Every task runs against localhost over HTTP, so which python ansible picked is
# irrelevant here — silence the interpreter-discovery warning it prints otherwise.
interpreter_python = auto_silent
