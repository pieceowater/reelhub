---
# =============================================================================
# Reelhub — bring the stack up and wire the services together
# =============================================================================
#
# Runs against a REMOTE server over SSH, named in inventory.ini — not against
# whatever machine you type `ansible-playbook` on. That machine (your laptop,
# say) only needs Ansible and SSH access; the target needs nothing but Ubuntu
# (or any apt-based Linux) and a user with sudo. Everything else — Docker, this
# repo's own files, every container, data/ and config/ — ends up living on the
# server, because Ansible modules execute on the target by default. That's also
# why every `localhost:PORT` API call throughout this file is correct as-is:
# when that task runs, "localhost" means the server, since the task itself runs
# there, not on your laptop.
#
# What this playbook does, in order:
#   0. Installs Docker on the target if it's missing, and checks out this repo
#      there (see project_dir below) — the only part that needs sudo.
#   1. Creates the media/download/config directory tree the containers bind-mount.
#   2. Runs `docker compose up -d`.
#   3. qBittorrent: reads the one-time password the container prints on first
#      boot, creates the movies/tv categories, then replaces the password with
#      the permanent credentials from vars.yml and sets the download path.
#   4. Reads the API keys Radarr / Sonarr / Prowlarr generate into their config.xml.
#   5. Radarr + Sonarr: registers qBittorrent as a download client and adds the
#      root folder each one imports into.
#   6. Prowlarr: registers Radarr and Sonarr as applications so every indexer you
#      add to Prowlarr is pushed to both automatically (Settings -> Apps -> Sync).
#   7. Jellyfin: runs the first-boot wizard headlessly and adds the two libraries.
#   8. Jellyseerr: links it to Jellyfin, Radarr and Sonarr.
#
# Requirements: ansible-core only — no extra collections, no Python deps.
# Everything talks to the services over their documented REST APIs.
#
# Run:
#   make deploy ANSIBLE_ARGS="--ask-pass --ask-become-pass"   (from the repo root)
#   cd ansible && ansible-playbook deploy.yml --ask-pass --ask-become-pass
#
# The two --ask-* flags are for password-based SSH: --ask-pass is the login
# password, needed on every run; --ask-become-pass is the sudo password, only
# actually used the first time (installing Docker) — omit it once that's done,
# or just leave it, since an unused become password is harmless. Using an SSH
# key instead? Drop both flags and point at the key in inventory.ini.
#
# -----------------------------------------------------------------------------
# Three rules this playbook follows, all learned the hard way:
#
# * Never treat a 400 as "already exists". The *arr APIs answer 400 for genuine
#   validation failures too — "cannot reach the download client", say — so
#   whitelisting it makes a broken run report success while configuring nothing.
#   Instead every create is preceded by a GET that checks whether the thing is
#   already there, and the POST itself only accepts real success codes.
#
# * Only POSIX shell tools, no GNU extensions. `grep -oP` is GNU-only and BSD
#   grep on macOS rejects -P outright, so the API keys are parsed with `sed`.
#   (Kept even now that the target is always Linux: costs nothing, and this
#   playbook ran against a Mac earlier in its life.)
#
# * Never put a number through a YAML `key: "{{ expression }}"` leaf when a
#   JSON body needs it to stay a number. Ansible's templating stringifies any
#   templated leaf beyond a bare variable — an attribute lookup or a filter is
#   enough — so `activeProfileId: "{{ x.id | int }}"` becomes the JSON string
#   "4", not the number 4, and a strict API rejects it outright. The fix,
#   where it matters (see the Jellyseerr registration tasks): build the whole
#   body as one Jinja dict literal and serialize it with to_json in the same
#   expression, which is the only combination that keeps the type.
# =============================================================================

- name: Deploy the Reelhub stack
  hosts: reelhub
  gather_facts: true
  vars_files:
    - vars.yml
  vars:
    # Where this repo lives on the TARGET server (not your laptop). Defaults
    # under the SSH user's own home directory so the initial checkout needs no
    # sudo. Change reelhub_dir if you'd rather it lived somewhere else.
    reelhub_dir: "{{ ansible_env.HOME }}/reelhub"

    # Where the config/ backup (see section 9, near the end) keeps its restic
    # repo. Deliberately outside reelhub_dir/project_dir: `make destroy` and a
    # bad `git reset` on the checkout should never be able to reach backups of
    # the very thing they might just have wiped.
    backup_repo_dir: "{{ ansible_env.HOME }}/reelhub-backups"
    reelhub_repo_url: https://github.com/pieceowater/reelhub.git
    reelhub_repo_branch: main
    project_dir: "{{ reelhub_dir }}"

    # Everything below is a plain, non-secret default. vars.yml (gitignored)
    # holds only the two passwords; override any of these here if you need
    # something other than the default for your setup.

    # Service ports. These only ever matter paired with the matching `ports:`
    # line in docker-compose.yml — to change one, edit both in the same commit.
    qbt_web_port: 8080
    radarr_port: 7878
    sonarr_port: 8989
    prowlarr_port: 9696
    jellyfin_port: 8096
    jellyseerr_port: 5055

    # qBittorrent Web UI username. The playbook sets this alongside qbt_new_pass
    # (from vars.yml) on the very first run.
    qbt_new_user: pcwt

    # Categories Radarr and Sonarr tag their downloads with. Each one gets its
    # own save path, which is what keeps finished movies and episodes in
    # separate trees.
    qbt_category_movies: movies
    qbt_category_tv: tv

    # Default download directory, as seen from inside the container
    # (./data on the host is mounted at /data).
    qbt_download_path: /data/downloads

    # Container-side paths where Radarr and Sonarr file finished media, and
    # where Jellyfin reads it from. Same filesystem as qbt_download_path on
    # purpose: imports become instant moves rather than slow copies.
    radarr_root: /data/media/movies
    sonarr_root: /data/media/tv

    # Jellyfin administrator username, created by the headless setup wizard on
    # the very first run. Ignored on later runs — if Jellyfin is already set
    # up, your existing account stays exactly as it is.
    jellyfin_admin_user: pcwt

    # ISO 639-2 codes. Reapplied on every run (it's just a playback preference,
    # not an account setting, so there's nothing to guard). Only takes effect
    # on media that actually has more than one audio/subtitle track — a plain
    # single-track English rip plays exactly as before either way.
    jellyfin_audio_language: rus
    jellyfin_subtitle_language: rus

    # The quality profile Jellyseerr requests movies/shows with — must be one
    # of the names Radarr/Sonarr create by default (Any, SD, HD-720p,
    # HD-1080p, Ultra-HD, HD - 720p/1080p). HD-1080p excludes 2160p and
    # Remux-2160p, which is what keeps a request from landing on a giant,
    # barely-seeded 4K release — see the comment above the Jellyseerr
    # registration tasks below for what that looked like in practice.
    jellyseerr_quality_profile: HD-1080p

    # How many points a Russian-audio match is worth in that profile — see the
    # comment above the Custom Format tasks below for what this does and why.
    russian_audio_score: 100

    # Radarr, Sonarr and Prowlarr's Web UI logins, each set once on the first
    # run that finds authentication still turned off. Ignored after that —
    # changing a password in any of their own UIs later is never overwritten.
    radarr_admin_user: pcwt
    sonarr_admin_user: pcwt
    prowlarr_admin_user: pcwt

    # Public indexers added automatically — no account needed for any of these.
    # See the comment above the task that uses this for how the list was
    # chosen and how to extend it. `docker compose exec prowlarr grep -i name
    # /config/... ` isn't needed to find more: Settings -> Indexers -> Add
    # Indexer in the UI shows every name Prowlarr supports, and any entry
    # marked "Public" there works the same way as these.
    prowlarr_public_indexers:
      - YTS
      - The Pirate Bay
      - LimeTorrents
      - TorrentDownload
      - Torrent Downloads
      - RuTor
      - NoNaMe Club
      - BigFANGroup
      - Knaben

  tasks:

    # ---------- 0. Bootstrap: Docker and this repo, on the target ----------
    #
    # The only section that needs sudo, and only on a machine that doesn't
    # already have Docker — every task here is skipped once docker_check
    # confirms it's present, so a second run against an already-bootstrapped
    # server touches none of this. Follows Docker's own documented Ubuntu
    # install steps (docs.docker.com/engine/install/ubuntu/) rather than the
    # distro's own `docker.io` package, which tends to lag behind upstream.
    - name: Check whether Docker is already installed
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Install Docker's prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, git]
        state: present
        update_cache: true
      become: true
      when: docker_check.rc != 0

    - name: Add Docker's official apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/ubuntu"
        suites: "{{ ansible_distribution_release }}"
        components: stable
        signed_by: "https://download.docker.com/linux/ubuntu/gpg"
        state: present
      become: true
      when: docker_check.rc != 0

    - name: Install Docker Engine and the Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      become: true
      when: docker_check.rc != 0

    - name: Make sure Docker is running and starts on boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
      become: true
      when: docker_check.rc != 0

    # Lets {{ ansible_user }} run `docker compose` without sudo, which every
    # later task in this playbook assumes. Group membership only takes effect
    # on a fresh login session — reset_connection forces exactly that, right
    # here, so the very next task already sees it. Skipping this would mean
    # every `docker compose` call from here on fails with a permissions error
    # against the socket, even though the group was "added" correctly.
    - name: "Add {{ ansible_user }} to the docker group"
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      become: true
      register: docker_group

    - name: Start a fresh connection so the new group membership applies
      ansible.builtin.meta: reset_connection
      when: docker_group is changed

    # No sudo needed from here: this clones into the user's own home
    # directory. Re-running just fast-forwards to the latest commit — data/
    # and config/ live inside this same tree but are gitignored, so they're
    # untracked as far as git is concerned and this never touches them.
    - name: Check out this repo on the server
      ansible.builtin.git:
        repo: "{{ reelhub_repo_url }}"
        dest: "{{ project_dir }}"
        version: "{{ reelhub_repo_branch }}"

    # ---------- 1. Directory layout and container startup ----------

    # The containers bind-mount ./data and ./config from the project root.
    # Docker would create these itself, but as root-owned directories, so we
    # create them up front as the invoking user to keep ownership sane.
    - name: Create the data and config directory tree
      ansible.builtin.file:
        path: "{{ project_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - data/media/movies
        - data/media/tv
        - data/downloads
        - config/qbittorrent
        - config/radarr
        - config/sonarr
        - config/prowlarr
        - config/jellyfin
        - config/jellyseerr
        - config/bazarr
        - config/recyclarr

    - name: Start the stack (docker compose up -d)
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ project_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"

    # ---------- 2. qBittorrent ----------

    # 403 counts as ready on purpose. /api/v2/app/version requires a session, so
    # an unauthenticated probe gets "403 Forbidden" once qBittorrent is up —
    # which is exactly the proof we want that the API is answering. Waiting for a
    # bare 200 here never succeeds and burns every retry before failing.
    - name: Wait for the qBittorrent Web UI to answer
      ansible.builtin.uri:
        url: "http://localhost:{{ qbt_web_port }}/api/v2/app/version"
        status_code: [200, 403]
      register: qbt_ping
      retries: 30
      delay: 3
      until: qbt_ping.status in [200, 403]

    # Current linuxserver/qbittorrent images no longer ship the old
    # admin/adminadmin default: they generate a random password on first boot and
    # print it to the container log exactly once. On later runs that line is gone
    # and this yields an empty string, so we fall back to the permanent password.
    # failed_when: false keeps an empty grep (exit 1) from aborting the play.
    - name: Read the one-time qBittorrent password from the container log
      ansible.builtin.shell: |
        docker compose logs qbittorrent 2>&1 \
          | grep -i "temporary password" | tail -1 \
          | grep -oE '[A-Za-z0-9]{6,}$'
      args:
        chdir: "{{ project_dir }}"
      register: qbt_temp_pass
      changed_when: false
      failed_when: false

    # First run  -> log in as admin with the one-time password.
    # Later runs -> log in with the permanent credentials from vars.yml.
    #
    # The Referer header is mandatory: qBittorrent rejects API requests without
    # one as cross-site. Older builds answer 200 on success, newer ones 204, so
    # both are accepted — what actually separates success from failure is whether
    # a session cookie came back (a bad password returns the body "Fails." and
    # sets no cookie at all).
    #
    # Note on repeated failures: qBittorrent bans the client IP for an hour after
    # a handful of bad logins. If you ever see 403 "Your IP address has been
    # banned" here, `docker compose restart qbittorrent` clears it — the ban list
    # is only held in memory.
    - name: Log in to the qBittorrent Web API
      ansible.builtin.uri:
        url: "http://localhost:{{ qbt_web_port }}/api/v2/auth/login"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ qbt_bootstrap_user }}"
          password: "{{ qbt_bootstrap_pass }}"
        headers:
          Referer: "http://localhost:{{ qbt_web_port }}"
        status_code: [200, 204]
        return_content: true
      vars:
        qbt_temp: "{{ qbt_temp_pass.stdout | default('') | trim }}"
        qbt_bootstrap_user: "{{ 'admin' if qbt_temp | length > 0 else qbt_new_user }}"
        qbt_bootstrap_pass: "{{ qbt_temp if qbt_temp | length > 0 else qbt_new_pass }}"
      register: qbt_login
      ignore_errors: true

    # `docker compose logs` replays the container's whole history, not just new
    # lines, so the one-time password from its original boot is still sitting
    # there long after qBittorrent invalidated it (the moment the permanent one
    # got set below). Re-running the play against a container that's been up a
    # while therefore always tries that stale password above and gets 401 — with
    # no fallback, every later qBittorrent step would then be skipped forever
    # even though the permanent password from vars.yml has been in effect the
    # whole time. Retry with it before giving up.
    - name: Log in to the qBittorrent Web API (fallback to the permanent password)
      ansible.builtin.uri:
        url: "http://localhost:{{ qbt_web_port }}/api/v2/auth/login"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ qbt_new_user }}"
          password: "{{ qbt_new_pass }}"
        headers:
          Referer: "http://localhost:{{ qbt_web_port }}"
        status_code: [200, 204]
        return_content: true
      register: qbt_login_fallback
      when: qbt_login.cookies_string | default('') | length == 0
      ignore_errors: true

    # Second fallback, for one specific case: qbt_new_user was changed in
    # vars.yml *after* qBittorrent was already renamed once. The account is
    # still under its old name, but this task only knows the new one — so it
    # tries qBittorrent's own original default, "admin", one more time before
    # giving up. Without this, changing the username here would silently stop
    # every later qBittorrent step from running rather than actually renaming
    # anything.
    - name: Log in to the qBittorrent Web API (fallback to the original admin account)
      ansible.builtin.uri:
        url: "http://localhost:{{ qbt_web_port }}/api/v2/auth/login"
        method: POST
        body_format: form-urlencoded
        body:
          username: admin
          password: "{{ qbt_new_pass }}"
        headers:
          Referer: "http://localhost:{{ qbt_web_port }}"
        status_code: [200, 204]
        return_content: true
      register: qbt_login_fallback2
      when:
        - qbt_login.cookies_string | default('') | length == 0
        - qbt_login_fallback.cookies_string | default('') | length == 0
        - qbt_new_user != 'admin'
      ignore_errors: true

    # Use the cookies_string the uri module assembles rather than parsing the
    # Set-Cookie header ourselves. The cookie is not called SID: it is
    # QBT_SID_<port> on current builds and has been renamed before, so matching
    # on a literal name silently breaks on the next release.
    - name: Keep the qBittorrent session cookie
      ansible.builtin.set_fact:
        # First non-empty cookie out of the three login attempts above, in order.
        qbt_cookie: >-
          {{ [qbt_login, qbt_login_fallback, qbt_login_fallback2]
             | map(attribute='cookies_string', default='')
             | select('truthy') | first }}
      when: >-
        [qbt_login, qbt_login_fallback, qbt_login_fallback2]
        | map(attribute='cookies_string', default='')
        | select('truthy') | list | length > 0

    - name: Warn if qBittorrent could not be logged into
      ansible.builtin.debug:
        msg: >-
          Could not authenticate to qBittorrent, so its categories and password
          were left alone. If the log above shows a 403 IP ban, run
          `docker compose restart qbittorrent` and then `make deploy` again.
      when: qbt_cookie is not defined

    # Categories come BEFORE the credential change on purpose: changing the
    # password can invalidate the session we are holding, and the categories are
    # the only thing here that needs an authenticated call afterwards.
    #
    # Radarr and Sonarr tag their downloads with one of these, and each
    # category's save path is what keeps finished movies and episodes in
    # separate trees. 409 means the category already exists.
    - name: Create the qBittorrent categories (movies/tv)
      ansible.builtin.uri:
        url: "http://localhost:{{ qbt_web_port }}/api/v2/torrents/createCategory"
        method: POST
        body_format: form-urlencoded
        body:
          category: "{{ item }}"
          savePath: "/data/media/{{ 'movies' if item == qbt_category_movies else 'tv' }}"
        headers:
          Referer: "http://localhost:{{ qbt_web_port }}"
          Cookie: "{{ qbt_cookie }}"
        status_code: [200, 204, 409]
      loop:
        - "{{ qbt_category_movies }}"
        - "{{ qbt_category_tv }}"
      when: qbt_cookie is defined

    # Writes the permanent credentials and the default download directory.
    # save_path is a path *inside* the container: ./data is mounted at /data.
    #
    # The value MUST go through to_json. Writing the JSON as a literal
    # "{...}" string here is a trap: when a Jinja2-rendered string happens to
    # look like a Python dict/list literal, Ansible's templating silently
    # converts it to a native dict — form-urlencoded then serializes it with
    # Python's repr(), which uses single quotes. qBittorrent receives
    # {'web_ui_username': 'admin', ...} instead of JSON, fails to parse it,
    # and answers 200 without changing anything, so the play reports success
    # while the password is left untouched. to_json forces an actual JSON
    # string and sidesteps the auto-conversion entirely.
    #
    # qBittorrent applies this immediately but only flushes qBittorrent.conf to
    # disk periodically and on clean shutdown. If you kill the container right
    # after this step the change can be lost — stop it with `make down` rather
    # than `docker kill`.
    - name: Set the permanent qBittorrent credentials and download path
      ansible.builtin.uri:
        url: "http://localhost:{{ qbt_web_port }}/api/v2/app/setPreferences"
        method: POST
        body_format: form-urlencoded
        body:
          json: "{{ qbt_preferences | to_json }}"
        headers:
          Referer: "http://localhost:{{ qbt_web_port }}"
          Cookie: "{{ qbt_cookie }}"
        status_code: [200, 204]
      vars:
        qbt_preferences:
          web_ui_username: "{{ qbt_new_user }}"
          web_ui_password: "{{ qbt_new_pass }}"
          save_path: "{{ qbt_download_path }}"
          # Peer-discovery tuning: this ISP puts us behind CGNAT (confirmed —
          # the router's own WAN IP is itself in RFC1918 space), so the
          # inbound peer port can never be reachable from outside no matter
          # how port-forwarding is configured on the home router. DHT/PEX/LSD
          # find peers through channels that don't depend on us accepting
          # inbound connections, and raising the connection ceiling means we
          # actually use more of whatever reachable peers we do find — this
          # doesn't fix the missing inbound port, it just uses everything
          # that's still available around it.
          dht: true
          pex: true
          lsd: true
          max_connec: 500
          max_connec_per_torrent: 150
          max_uploads: 20
          max_uploads_per_torrent: 6
      when: qbt_cookie is defined

    # Verify the change actually took — see the to_json note above for why this
    # is not just defensive. A stale password here means the qBittorrent
    # downloadclient tasks on Radarr/Sonarr will fail with a clear "Unable to
    # connect to qBittorrent" instead of silently leaving the old one wired up.
    - name: Verify the new qBittorrent password works
      ansible.builtin.uri:
        url: "http://localhost:{{ qbt_web_port }}/api/v2/auth/login"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ qbt_new_user }}"
          password: "{{ qbt_new_pass }}"
        headers:
          Referer: "http://localhost:{{ qbt_web_port }}"
        status_code: [200, 204]
      when: qbt_cookie is defined

    # ---------- 3. Collect the *arr API keys ----------

    # Radarr, Sonarr and Prowlarr each generate a random API key on first boot
    # and write it into /config/config.xml. Nothing can be configured over their
    # APIs until that file exists, so wait for it.
    - name: Wait for the *arr apps to write their config.xml
      ansible.builtin.wait_for:
        path: "{{ project_dir }}/config/{{ item }}/config.xml"
        timeout: 120
      loop:
        - radarr
        - sonarr
        - prowlarr

    # Portable extraction: BSD sed (macOS) and GNU sed (Linux) both understand
    # this BRE. Do not "simplify" it to `grep -oP '(?<=<ApiKey>)[^<]+'` —
    # -P is a GNU extension, and on macOS that fails with
    # "grep: invalid option -- P" and aborts the whole play right here.
    - name: Read the API keys out of each config.xml
      ansible.builtin.shell: >
        sed -n 's|.*<ApiKey>\([^<]*\)</ApiKey>.*|\1|p'
        "{{ project_dir }}/config/{{ item }}/config.xml"
      loop:
        - radarr
        - sonarr
        - prowlarr
      register: api_keys_raw
      changed_when: false

    - name: Store the API keys as facts
      ansible.builtin.set_fact:
        radarr_api_key: "{{ api_keys_raw.results[0].stdout | trim }}"
        sonarr_api_key: "{{ api_keys_raw.results[1].stdout | trim }}"
        prowlarr_api_key: "{{ api_keys_raw.results[2].stdout | trim }}"

    - name: Fail early if any API key came back empty
      ansible.builtin.assert:
        that:
          - radarr_api_key | length > 0
          - sonarr_api_key | length > 0
          - prowlarr_api_key | length > 0
        fail_msg: >-
          Could not read one or more API keys from config/*/config.xml.
          Check that the radarr/sonarr/prowlarr containers started cleanly
          (make logs S=radarr) before re-running.

    # config.xml is written well before the web server starts accepting requests,
    # so the wait above is not a readiness check on its own — the first API call
    # lands on a socket that closes without responding ("Status code was -1").
    # Wait until each app actually answers an authenticated request.
    - name: Wait for the *arr APIs to start answering
      ansible.builtin.uri:
        url: "http://localhost:{{ item.port }}/api/{{ item.api }}/system/status"
        headers:
          X-Api-Key: "{{ item.key }}"
        status_code: 200
      register: arr_ready
      retries: 30
      delay: 3
      until: arr_ready.status is defined and arr_ready.status == 200
      changed_when: false
      loop:
        - { name: radarr, port: "{{ radarr_port }}", api: v3, key: "{{ radarr_api_key }}" }
        - { name: sonarr, port: "{{ sonarr_port }}", api: v3, key: "{{ sonarr_api_key }}" }
        - { name: prowlarr, port: "{{ prowlarr_port }}", api: v1, key: "{{ prowlarr_api_key }}" }
      loop_control:
        label: "{{ item.name }}"

    # ---------- 3b. Radarr / Sonarr / Prowlarr: set a UI login ----------
    #
    # All three now refuse "no authentication" outright — each Web UI blocks
    # on an "Authentication Required" modal until a method is chosen, and each
    # one's config API rejects authenticationMethod: none too. This has
    # nothing to do with how they talk to EACH OTHER (that's always the
    # X-Api-Key header, unaffected by this) — it's purely each app's own
    # browser login. Guarded per-app on authenticationMethod still being
    # "none" so a password you change later in any of their UIs is never
    # overwritten by a later `make deploy`.
    - name: "Radarr / Sonarr / Prowlarr: check current authentication settings"
      ansible.builtin.uri:
        url: "http://localhost:{{ item.port }}/api/{{ item.api }}/config/host"
        headers:
          X-Api-Key: "{{ item.key }}"
        status_code: 200
      register: arr_host_config
      changed_when: false
      loop:
        - { name: radarr, port: "{{ radarr_port }}", api: v3, key: "{{ radarr_api_key }}", user: "{{ radarr_admin_user }}", pass: "{{ radarr_admin_pass }}" }
        - { name: sonarr, port: "{{ sonarr_port }}", api: v3, key: "{{ sonarr_api_key }}", user: "{{ sonarr_admin_user }}", pass: "{{ sonarr_admin_pass }}" }
        - { name: prowlarr, port: "{{ prowlarr_port }}", api: v1, key: "{{ prowlarr_api_key }}", user: "{{ prowlarr_admin_user }}", pass: "{{ prowlarr_admin_pass }}" }
      loop_control:
        label: "{{ item.name }}"

    - name: "Radarr / Sonarr / Prowlarr: set a UI login"
      ansible.builtin.uri:
        url: "http://localhost:{{ item.item.port }}/api/{{ item.item.api }}/config/host"
        method: PUT
        headers:
          X-Api-Key: "{{ item.item.key }}"
        body_format: json
        # The API expects the full resource back, not a partial patch — start
        # from what the matching GET above returned and only override the
        # auth fields.
        body: >-
          {{ item.json | combine({
               'authenticationMethod': 'forms',
               'authenticationRequired': 'disabledForLocalAddresses',
               'username': item.item.user,
               'password': item.item.pass,
               'passwordConfirmation': item.item.pass,
             }) }}
        status_code: [200, 202]
      loop: "{{ arr_host_config.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      # Skips the login prompt for anything on your LAN/localhost; still
      # requires it if reached from outside the network.
      when: item.json.authenticationMethod == "none"

    # ---------- 4. Radarr: download client + root folder ----------

    # Each create is guarded by a GET so re-runs are no-ops, which lets the POST
    # demand a real success code instead of shrugging off 400s. Radarr validates
    # the download client by actually connecting to it, so a 400 here means
    # something is genuinely wrong (usually wrong qBittorrent credentials) and
    # you want to hear about it.
    - name: "Radarr: list existing download clients"
      ansible.builtin.uri:
        url: "http://localhost:{{ radarr_port }}/api/v3/downloadclient"
        headers:
          X-Api-Key: "{{ radarr_api_key }}"
        status_code: 200
      register: radarr_clients
      changed_when: false

    # host is `qbittorrent`, not localhost: this configures how Radarr reaches
    # qBittorrent, and that traffic goes container-to-container over the compose
    # network, where the service name is the hostname.
    - name: "Radarr: register qBittorrent as the download client"
      ansible.builtin.uri:
        url: "http://localhost:{{ radarr_port }}/api/v3/downloadclient"
        method: POST
        headers:
          X-Api-Key: "{{ radarr_api_key }}"
        body_format: json
        body:
          enable: true
          protocol: torrent
          priority: 1
          name: qBittorrent
          implementation: QBittorrent
          configContract: QBittorrentSettings
          fields:
            - { name: host, value: qbittorrent }
            - { name: port, value: "{{ qbt_web_port }}" }
            - { name: username, value: "{{ qbt_new_user }}" }
            - { name: password, value: "{{ qbt_new_pass }}" }
            - { name: category, value: "{{ qbt_category_movies }}" }
            - { name: useSsl, value: false }
        status_code: [200, 201]
      when: "'qBittorrent' not in (radarr_clients.json | map(attribute='name') | list)"

    - name: "Radarr: list existing root folders"
      ansible.builtin.uri:
        url: "http://localhost:{{ radarr_port }}/api/v3/rootfolder"
        headers:
          X-Api-Key: "{{ radarr_api_key }}"
        status_code: 200
      register: radarr_roots
      changed_when: false

    # Where Radarr moves finished movies. Container-side path (./data -> /data).
    - name: "Radarr: add the movies root folder"
      ansible.builtin.uri:
        url: "http://localhost:{{ radarr_port }}/api/v3/rootfolder"
        method: POST
        headers:
          X-Api-Key: "{{ radarr_api_key }}"
        body_format: json
        body:
          path: "{{ radarr_root }}"
        status_code: [200, 201]
      when: radarr_root not in (radarr_roots.json | map(attribute='path') | list)

    # ---------- 5. Sonarr: download client + root folder ----------

    - name: "Sonarr: list existing download clients"
      ansible.builtin.uri:
        url: "http://localhost:{{ sonarr_port }}/api/v3/downloadclient"
        headers:
          X-Api-Key: "{{ sonarr_api_key }}"
        status_code: 200
      register: sonarr_clients
      changed_when: false

    - name: "Sonarr: register qBittorrent as the download client"
      ansible.builtin.uri:
        url: "http://localhost:{{ sonarr_port }}/api/v3/downloadclient"
        method: POST
        headers:
          X-Api-Key: "{{ sonarr_api_key }}"
        body_format: json
        body:
          enable: true
          protocol: torrent
          priority: 1
          name: qBittorrent
          implementation: QBittorrent
          configContract: QBittorrentSettings
          fields:
            - { name: host, value: qbittorrent }
            - { name: port, value: "{{ qbt_web_port }}" }
            - { name: username, value: "{{ qbt_new_user }}" }
            - { name: password, value: "{{ qbt_new_pass }}" }
            - { name: category, value: "{{ qbt_category_tv }}" }
            - { name: useSsl, value: false }
        status_code: [200, 201]
      when: "'qBittorrent' not in (sonarr_clients.json | map(attribute='name') | list)"

    - name: "Sonarr: list existing root folders"
      ansible.builtin.uri:
        url: "http://localhost:{{ sonarr_port }}/api/v3/rootfolder"
        headers:
          X-Api-Key: "{{ sonarr_api_key }}"
        status_code: 200
      register: sonarr_roots
      changed_when: false

    - name: "Sonarr: add the TV root folder"
      ansible.builtin.uri:
        url: "http://localhost:{{ sonarr_port }}/api/v3/rootfolder"
        method: POST
        headers:
          X-Api-Key: "{{ sonarr_api_key }}"
        body_format: json
        body:
          path: "{{ sonarr_root }}"
        status_code: [200, 201]
      when: sonarr_root not in (sonarr_roots.json | map(attribute='path') | list)

    # ---------- 6. Prowlarr: push indexers to Radarr and Sonarr ----------

    # Registering Radarr/Sonarr as Prowlarr "applications" with syncLevel
    # fullSync means every indexer you add in Prowlarr later is copied into both
    # automatically — you never configure the same tracker three times.
    #
    # syncCategories are Newznab/Torznab category IDs: the 2xxx range is movies,
    # the 5xxx range is TV. They tell Prowlarr which results belong to which app.
    #
    # prowlarrUrl/baseUrl use compose service names because Prowlarr and the *arr
    # apps talk to each other inside the docker network, not through localhost.
    - name: "Prowlarr: list existing applications"
      ansible.builtin.uri:
        url: "http://localhost:{{ prowlarr_port }}/api/v1/applications"
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
        status_code: 200
      register: prowlarr_apps
      changed_when: false

    - name: "Prowlarr: connect Radarr for indexer sync"
      ansible.builtin.uri:
        url: "http://localhost:{{ prowlarr_port }}/api/v1/applications"
        method: POST
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
        body_format: json
        body:
          name: Radarr
          implementation: Radarr
          configContract: RadarrSettings
          syncLevel: fullSync
          fields:
            - { name: prowlarrUrl, value: "http://prowlarr:{{ prowlarr_port }}" }
            - { name: baseUrl, value: "http://radarr:{{ radarr_port }}" }
            - { name: apiKey, value: "{{ radarr_api_key }}" }
            - { name: syncCategories, value: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060] }
        status_code: [200, 201]
      when: "'Radarr' not in (prowlarr_apps.json | map(attribute='name') | list)"

    - name: "Prowlarr: connect Sonarr for indexer sync"
      ansible.builtin.uri:
        url: "http://localhost:{{ prowlarr_port }}/api/v1/applications"
        method: POST
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
        body_format: json
        body:
          name: Sonarr
          implementation: Sonarr
          configContract: SonarrSettings
          syncLevel: fullSync
          fields:
            - { name: prowlarrUrl, value: "http://prowlarr:{{ prowlarr_port }}" }
            - { name: baseUrl, value: "http://sonarr:{{ sonarr_port }}" }
            - { name: apiKey, value: "{{ sonarr_api_key }}" }
            - { name: syncCategories, value: [5000, 5010, 5020, 5030, 5040, 5045, 5050] }
        status_code: [200, 201]
      when: "'Sonarr' not in (prowlarr_apps.json | map(attribute='name') | list)"

    # ---------- 6b. Prowlarr: add public indexers ----------
    #
    # Private trackers still need your own account and API key — nobody can
    # pre-bake that, and it stays the one genuinely manual step (see the
    # README). Public indexers need nothing at all: Prowlarr ships built-in
    # definitions that scrape the site directly, so a curated set of them can
    # be added the same way everything else here is.
    #
    # Nine well-known, high-uptime trackers, kept to ones that need no
    # FlareSolverr proxy — this stack doesn't run one, and several other
    # popular sites (1337x, EZTV, the KickassTorrents mirrors) sit behind
    # Cloudflare and would silently return zero results without it. Every one
    # of these nine was hand-verified to return real, well-seeded results
    # before being added here — two others that looked equally promising in
    # Prowlarr's catalog, Internet Archive and Magnet Cat, failed that check
    # (DNS/SSL errors and a Cloudflare block respectively) and were left out.
    # Add FlareSolverr as a service and the Cloudflare-gated ones become
    # viable too, but that's a genuinely separate piece of infrastructure to
    # run. RuTor, NoNaMe Club and BigFANGroup are Russian-language trackers,
    # useful for dubbed/multi-audio releases; Knaben is a meta-search engine
    # covering many sites at once, so it broadens results well beyond its own
    # name.
    #
    # Not every one of these ends up wired to Radarr/Sonarr even though it's
    # genuinely working: both apps test-query a new indexer in its own
    # category before accepting it, and reject the whole thing if that one
    # query happens to return nothing — observed on The Pirate Bay, RuTor and
    # Torrent Downloads, which all return real results on a direct Prowlarr
    # search. Harmless (Prowlarr itself still has all nine, so nothing here
    # is broken), and outside this playbook's control since it's Radarr's and
    # Sonarr's own validation, not Prowlarr's.
    # This one isn't just returning bundled data: Prowlarr uses the call to
    # refresh its indexer-definition cache from GitHub first, so it makes an
    # outbound HTTP request before it answers. That request can occasionally
    # take a while — observed timing out outright while this stack's own
    # downloads were saturating the network — so this gets a longer timeout
    # and its own retries rather than sharing the module's 30s default.
    - name: "Prowlarr: fetch the indexer definition catalog"
      ansible.builtin.uri:
        url: "http://localhost:{{ prowlarr_port }}/api/v1/indexer/schema"
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
        status_code: 200
        timeout: 90
      register: prowlarr_indexer_schema
      retries: 4
      delay: 15
      until: prowlarr_indexer_schema is succeeded
      changed_when: false

    - name: "Prowlarr: list existing indexers"
      ansible.builtin.uri:
        url: "http://localhost:{{ prowlarr_port }}/api/v1/indexer"
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
        status_code: 200
      register: prowlarr_indexer_list
      changed_when: false

    - name: "Prowlarr: get the default sync profile"
      ansible.builtin.uri:
        url: "http://localhost:{{ prowlarr_port }}/api/v1/appprofile"
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
        status_code: 200
      register: prowlarr_app_profiles
      changed_when: false

    # Each schema entry is a complete, ready-to-use indexer definition —
    # Prowlarr hands it right back as the resource to POST, it just needs a
    # real sync profile attached (the schema's own appProfileId: 0 means
    # "unset"). Guarded by name against the existing list so re-running never
    # duplicates one, and so a tracker you remove in Prowlarr's UI stays gone.
    - name: "Prowlarr: add public indexers"
      ansible.builtin.uri:
        url: "http://localhost:{{ prowlarr_port }}/api/v1/indexer"
        method: POST
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
        body_format: json
        body: >-
          {{ (prowlarr_indexer_schema.json | selectattr('name', 'equalto', item) | first)
             | combine({'appProfileId': prowlarr_app_profiles.json[0].id}) }}
        status_code: [200, 201]
      loop: "{{ prowlarr_public_indexers }}"
      loop_control:
        label: "{{ item }}"
      when: item not in (prowlarr_indexer_list.json | map(attribute='name') | list)

    # Prowlarr syncs to Radarr/Sonarr automatically whenever an indexer
    # changes, but forcing it here means the new ones are searchable
    # immediately rather than waiting on Prowlarr's own schedule.
    - name: "Prowlarr: push the new indexers to Radarr and Sonarr now"
      ansible.builtin.uri:
        url: "http://localhost:{{ prowlarr_port }}/api/v1/command"
        method: POST
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
        body_format: json
        body:
          name: ApplicationIndexerSync
        status_code: 201
      ignore_errors: true

    # ---------- 6c. Prowlarr: register FlareSolverr ----------
    #
    # FlareSolverr solves the Cloudflare JS challenge that sits in front of
    # some indexers (1337x, EZTV, the KickassTorrents mirrors — see the
    # comment on "Prowlarr: add public indexers" above for why those were
    # left out until now). Registering it here is what actually lets Prowlarr
    # use it; the indexer list above still only adds trackers that don't need
    # it, on purpose, since verifying which Cloudflare-gated ones are
    # actually worth adding is its own separate pass.
    #
    # implementation/configContract/field names are Prowlarr's own — read
    # from its source (IndexerProxies/FlareSolverr/FlareSolverrSettings.cs),
    # not guessed.
    - name: "Prowlarr: list existing indexer proxies"
      ansible.builtin.uri:
        url: "http://localhost:{{ prowlarr_port }}/api/v1/indexerproxy"
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
        status_code: 200
      register: prowlarr_proxies
      changed_when: false
      tags: [flaresolverr]

    - name: "Prowlarr: register FlareSolverr as an indexer proxy"
      ansible.builtin.uri:
        url: "http://localhost:{{ prowlarr_port }}/api/v1/indexerproxy"
        method: POST
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
        body_format: json
        body:
          name: FlareSolverr
          implementation: FlareSolverr
          implementationName: FlareSolverr
          configContract: FlareSolverrSettings
          fields:
            - { name: host, value: "http://flaresolverr:8191/" }
            - { name: requestTimeout, value: 60 }
          tags: []
        status_code: [200, 201]
      when: "'FlareSolverr' not in (prowlarr_proxies.json | map(attribute='name') | list)"
      tags: [flaresolverr]

    # ---------- 7. Jellyfin: headless first-boot wizard ----------
    #
    # The /Startup/* endpoints are internal and have changed between Jellyfin
    # releases, so each task here is best-effort: a version mismatch degrades
    # into "finish this in the browser" instead of failing the run. The manual
    # fallback is simply opening http://localhost:8096, where the same wizard
    # runs interactively.
    #
    # One ordering rule matters: do NOT call /Startup/Complete unless the admin
    # user was created. Completing the wizard without a user leaves Jellyfin in a
    # state where the wizard will not run again and no account exists to log in
    # with, and the only way out is deleting config/jellyfin.

    - name: "Jellyfin: wait for the server and check whether the wizard ran"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyfin_port }}/System/Info/Public"
        status_code: 200
      register: jf_info
      retries: 20
      delay: 3
      until: jf_info.status == 200 and jf_info.json is defined

    - name: "Jellyfin: set language and metadata locale"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyfin_port }}/Startup/Configuration"
        method: POST
        body_format: json
        body:
          UICulture: "en-US"
          MetadataCountryCode: "US"
          PreferredMetadataLanguage: "en"
        status_code: [200, 204]
      when: not (jf_info.json.StartupWizardCompleted | default(false))
      ignore_errors: true

    # On Jellyfin 10.11.11, POSTing /Startup/User cold — without ever having hit
    # it with GET first — returns a flat, permanent 404, not a transient one:
    # it was reproduced 40 retries and 2 full minutes deep with no recovery.
    # Issuing the GET first (its response is just a placeholder, {"Name":"abc"},
    # and is not used for anything) reliably unblocks the POST on the very next
    # call. Almost certainly a lazy route/formatter initialization bug scoped to
    # GET requests on this endpoint; whatever the cause, this priming step is
    # what actually fixes it — a longer retry loop on the POST alone does not.
    - name: "Jellyfin: prime the /Startup/User route"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyfin_port }}/Startup/User"
        status_code: 200
      when: not (jf_info.json.StartupWizardCompleted | default(false))
      ignore_errors: true

    - name: "Jellyfin: create the administrator account"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyfin_port }}/Startup/User"
        method: POST
        body_format: json
        body:
          Name: "{{ jellyfin_admin_user }}"
          Password: "{{ jellyfin_admin_pass }}"
        status_code: [200, 204]
      register: jf_user
      retries: 20
      delay: 3
      until: jf_user.status is defined and jf_user.status in [200, 204]
      when: not (jf_info.json.StartupWizardCompleted | default(false))
      ignore_errors: true

    # Guarded on jf_user succeeding — see the ordering note above. On current
    # Jellyfin the account is only actually persisted by this call.
    - name: "Jellyfin: finish the wizard"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyfin_port }}/Startup/Complete"
        method: POST
        status_code: [200, 204]
      when:
        - not (jf_info.json.StartupWizardCompleted | default(false))
        - jf_user is succeeded
      ignore_errors: true

    # Adding libraries needs a real access token. The client identification has
    # to go in the standard `Authorization` header: the old X-Emby-Authorization
    # header is gone in Jellyfin 12 and sending it gets a flat 400.
    - name: "Jellyfin: authenticate as the administrator"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyfin_port }}/Users/AuthenticateByName"
        method: POST
        body_format: json
        body:
          Username: "{{ jellyfin_admin_user }}"
          Pw: "{{ jellyfin_admin_pass }}"
        headers:
          Authorization: >-
            MediaBrowser Client="ansible", Device="ansible", DeviceId="reelhub-ansible", Version="1.0"
        status_code: 200
        return_content: true
      register: jf_auth
      ignore_errors: true

    - name: "Jellyfin: store the access token"
      ansible.builtin.set_fact:
        jf_token: "{{ jf_auth.json.AccessToken }}"
        jf_user_id: "{{ jf_auth.json.User.Id }}"
        jf_user_policy: "{{ jf_auth.json.User.Policy }}"
        jf_user_config: "{{ jf_auth.json.User.Configuration }}"
      when: jf_auth is succeeded and jf_auth.json is defined and jf_auth.json.AccessToken is defined

    # Smart subtitle mode shows subtitles automatically for dialogue that
    # isn't in the preferred audio language (e.g. an English original with a
    # Russian audio preference set), rather than requiring you to turn them on
    # by hand every time. Both preferences are no-ops on a file with only one
    # audio track and no embedded subtitles — most plain single-language rips.
    - name: "Jellyfin: set the audio/subtitle language preference"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyfin_port }}/Users/{{ jf_user_id }}/Configuration"
        method: POST
        headers:
          Authorization: 'MediaBrowser Token="{{ jf_token }}"'
        body_format: json
        body: >-
          {{ jf_user_config | combine({
               'AudioLanguagePreference': jellyfin_audio_language,
               'SubtitleLanguagePreference': jellyfin_subtitle_language,
               'SubtitleMode': 'Smart',
             }) }}
        status_code: [200, 204]
      when: jf_token is defined
      ignore_errors: true

    # The account /Startup/User creates is marked IsHidden: true (hidden from
    # the login screen), which is fine for Jellyfin itself but breaks Jellyseerr:
    # its first-run Jellyfin login requires a visible administrator and answers
    # a flat 500 NO_ADMIN_USER otherwise, with nothing in the response pointing
    # at IsHidden as the cause. Un-hide it so Jellyseerr's setup step below has
    # an account it will accept.
    - name: "Jellyfin: make the administrator account visible on the login screen"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyfin_port }}/Users/{{ jf_user_id }}/Policy"
        method: POST
        headers:
          Authorization: 'MediaBrowser Token="{{ jf_token }}"'
        body_format: json
        body: "{{ jf_user_policy | combine({'IsHidden': false}) }}"
        status_code: [200, 204]
      when: jf_token is defined and jf_user_policy.IsHidden | default(false)
      ignore_errors: true

    - name: "Jellyfin: list existing libraries"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyfin_port }}/Library/VirtualFolders"
        headers:
          Authorization: 'MediaBrowser Token="{{ jf_token }}"'
        status_code: 200
      register: jf_libs
      when: jf_token is defined
      changed_when: false
      ignore_errors: true

    # These paths are the ones Radarr and Sonarr import into, so anything they
    # finish shows up in Jellyfin without a second copy.
    - name: "Jellyfin: add the Movies library"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyfin_port }}/Library/VirtualFolders?name=Movies&collectionType=movies&refreshLibrary=true"
        method: POST
        headers:
          Authorization: 'MediaBrowser Token="{{ jf_token }}"'
        body_format: json
        body:
          LibraryOptions:
            PathInfos:
              - Path: "{{ radarr_root }}"
        status_code: [200, 204]
      when:
        - jf_token is defined
        - jf_libs is succeeded
        - "'Movies' not in (jf_libs.json | default([]) | map(attribute='Name') | list)"
      ignore_errors: true

    - name: "Jellyfin: add the TV Shows library"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyfin_port }}/Library/VirtualFolders?name=TV%20Shows&collectionType=tvshows&refreshLibrary=true"
        method: POST
        headers:
          Authorization: 'MediaBrowser Token="{{ jf_token }}"'
        body_format: json
        body:
          LibraryOptions:
            PathInfos:
              - Path: "{{ sonarr_root }}"
        status_code: [200, 204]
      when:
        - jf_token is defined
        - jf_libs is succeeded
        - "'TV Shows' not in (jf_libs.json | default([]) | map(attribute='Name') | list)"
      ignore_errors: true

    # Intel Quick Sync (VAAPI) hardware transcoding — only runs if /dev/dri
    # actually exists in the container (see the `devices:` comment on
    # jellyfin in docker-compose.yml). Verified live against this exact
    # server's Jellyfin 10.11.11 before being written here.
    #
    # POST replaces the whole EncodingOptions object rather than merging —
    # confirmed straight from Jellyfin's ConfigurationController source, not
    # assumed — so this GETs the current config first and POSTs the full
    # object back with only these fields changed; skipping the GET would
    # silently reset every other encoding setting (CRF, muxing queue size,
    # etc.) to their factory defaults.
    - name: "Jellyfin: check for a hardware transcode device"
      ansible.builtin.stat:
        path: /dev/dri
      register: jf_dri_device

    - name: "Jellyfin: fetch the current encoding configuration"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyfin_port }}/System/Configuration/encoding"
        headers:
          Authorization: 'MediaBrowser Token="{{ jf_token }}"'
        status_code: 200
      register: jf_encoding
      when: jf_token is defined and jf_dri_device.stat.exists
      changed_when: false
      ignore_errors: true

    # AllowAv1Encoding is deliberately left at whatever it already was:
    # nothing here asserts this hardware supports AV1, so this doesn't turn
    # it on, but it also doesn't turn off a value you set by hand later.
    # EnableDecodingColorDepth10Hevc: false is the one non-obvious flip — an
    # Intel iGPU without 10-bit HEVC decode (Skylake and earlier) will try
    # and fail on 10-bit HEVC sources if this stays at Jellyfin's own
    # default of true, rather than falling back to software decode cleanly.
    - name: "Jellyfin: turn on Intel Quick Sync (VAAPI) hardware transcoding"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyfin_port }}/System/Configuration/encoding"
        method: POST
        headers:
          Authorization: 'MediaBrowser Token="{{ jf_token }}"'
        body_format: json
        body: >-
          {{ jf_encoding.json | combine({
               'HardwareAccelerationType': 'vaapi',
               'VaapiDevice': '/dev/dri/renderD128',
               'EnableHardwareEncoding': true,
               'HardwareDecodingCodecs': (jf_encoding.json.HardwareDecodingCodecs | default([]) | union(['hevc'])),
               'AllowHevcEncoding': true,
               'EnableDecodingColorDepth10Hevc': false,
             }) }}
        status_code: [200, 204]
      when:
        - jf_token is defined
        - jf_dri_device.stat.exists
        - jf_encoding is succeeded
        - jf_encoding.json.HardwareAccelerationType | default('none') != 'vaapi'
      ignore_errors: true

    # ---------- 8. Jellyseerr: link Jellyfin / Radarr / Sonarr ----------
    #
    # Jellyseerr's setup API is session-based, not key-based: /api/v1/auth/jellyfin
    # signs in and returns a connect.sid cookie, and every /api/v1/settings/*
    # call has to carry it or you get a flat 401. Best-effort like Jellyfin
    # above; the fallback is the setup wizard at http://localhost:5055.

    - name: "Jellyseerr: wait for it to start answering"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyseerr_port }}/api/v1/status"
        status_code: 200
      register: jsr_ready
      retries: 30
      delay: 3
      until: jsr_ready.status is defined and jsr_ready.status == 200
      changed_when: false
      ignore_errors: true

    - name: "Jellyseerr: check whether it has been set up yet"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyseerr_port }}/api/v1/settings/public"
        status_code: 200
      register: jsr_public
      changed_when: false
      ignore_errors: true

    # This one call does double duty depending on Jellyseerr's state, and the
    # request shape for each is different — mixing them up is what "NO_ADMIN_USER"
    # and "Jellyfin hostname already configured" turn out to mean:
    #
    #   - Never configured (this task): body carries hostname + serverType and
    #     the response both signs in AND wires Jellyfin as the media server.
    #     serverType is mandatory here — 2 is Jellyfin (1 is Plex, 3 is Emby) —
    #     omit it and Jellyseerr answers 500 NO_ADMIN_USER even for a genuine
    #     admin, because it never reaches the "is this user an admin" check.
    #   - Already configured (the task below): the SAME endpoint is now a plain
    #     login and REJECTS a body that still has `hostname` in it with
    #     500 "Jellyfin hostname already configured" — so re-running the setup
    #     body on every deploy breaks a working install. hostname must be
    #     omitted here to get a session cookie instead.
    - name: "Jellyseerr: link to Jellyfin (first-time setup)"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyseerr_port }}/api/v1/auth/jellyfin"
        method: POST
        body_format: json
        body:
          username: "{{ jellyfin_admin_user }}"
          password: "{{ jellyfin_admin_pass }}"
          hostname: "jellyfin"
          port: "{{ jellyfin_port }}"
          useSsl: false
          urlBase: ""
          serverType: 2
        status_code: [200, 201]
      register: jsr_setup
      when: not (jsr_public.json.initialized | default(false))
      ignore_errors: true

    - name: "Jellyseerr: log in (already set up)"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyseerr_port }}/api/v1/auth/jellyfin"
        method: POST
        body_format: json
        body:
          username: "{{ jellyfin_admin_user }}"
          password: "{{ jellyfin_admin_pass }}"
        status_code: [200, 201]
      register: jsr_login
      when: jsr_public.json.initialized | default(false)
      ignore_errors: true

    - name: "Jellyseerr: keep the session cookie"
      ansible.builtin.set_fact:
        jsr_cookie: "{{ (jsr_setup if not (jsr_public.json.initialized | default(false)) else jsr_login).cookies_string }}"
      when: (jsr_setup is succeeded or jsr_login is succeeded) | default(false)
      ignore_errors: true

    # "Any" — Radarr/Sonarr's own factory-default profile — allows literally
    # everything including 2160p Remux, and their scoring has no concept of
    # swarm health: a rare, giant, barely-seeded 4K release scores higher than
    # a common, fast 1080p one and gets grabbed instead. Observed downloading
    # at a few hundred KB/s with an ETA in days from a 19-seed swarm, versus
    # minutes from a 1080p release of the same film with hundreds of seeders.
    # HD-1080p excludes 2160p/Remux-2160p entirely, so this can't happen —
    # looked up by name rather than hardcoding its id, since a profile's id is
    # just its creation order and isn't guaranteed stable.
    - name: "Radarr: list quality profiles"
      ansible.builtin.uri:
        url: "http://localhost:{{ radarr_port }}/api/v3/qualityprofile"
        headers:
          X-Api-Key: "{{ radarr_api_key }}"
        status_code: 200
      register: radarr_quality_profiles
      changed_when: false

    - name: "Sonarr: list quality profiles"
      ansible.builtin.uri:
        url: "http://localhost:{{ sonarr_port }}/api/v3/qualityprofile"
        headers:
          X-Api-Key: "{{ sonarr_api_key }}"
        status_code: 200
      register: sonarr_quality_profiles
      changed_when: false

    # ---------- 8b. Radarr / Sonarr: prefer Russian-audio releases ----------
    #
    # Quality profiles only ever compare resolution/source — they have no idea
    # what language a release is in, so within the same tier (HD-1080p) Radarr
    # and Sonarr grab whichever release scores highest by quality alone. Since
    # the big English-language public trackers (YTS, TPB, TorrentDownload) vastly
    # out-seed the Russian ones added earlier, that's what wins every time even
    # though RuTor/NoNaMe Club/BigFANGroup releases exist and would work fine.
    # A Custom Format fixes this: match on release title, add a fixed point
    # bonus for that match in the profile, and now a Russian release wins the
    # comparison whenever one exists — with no bonus at all when it doesn't, so
    # English-only titles are grabbed exactly as before. Not a hard requirement:
    # an English release still gets grabbed if no Russian one exists, matching
    # "Russian if available, original with subtitles otherwise."
    #
    # This also flips on upgrading: by default a profile stops looking the
    # moment a movie/episode has ANY accepted file, English included, so
    # something grabbed before a Russian release existed would stay English
    # forever. upgradeAllowed + cutoffFormatScore matching the bonus above
    # tells Radarr/Sonarr to keep searching (on their normal schedule, or
    # right away if you hit Search yourself) until something scores at least
    # that high, and to replace the file automatically once it does. It still
    # has to actually download that release, though — there's no way to
    # retroactively add a Russian track to a file that doesn't have one.
    - name: "Radarr / Sonarr: list custom formats"
      ansible.builtin.uri:
        url: "http://localhost:{{ item.port }}/api/{{ item.api }}/customformat"
        headers:
          X-Api-Key: "{{ item.key }}"
        status_code: 200
      register: arr_custom_formats
      changed_when: false
      loop: &arr_apps
        - { name: radarr, port: "{{ radarr_port }}", api: v3, key: "{{ radarr_api_key }}" }
        - { name: sonarr, port: "{{ sonarr_port }}", api: v3, key: "{{ sonarr_api_key }}" }
      loop_control:
        label: "{{ item.name }}"

    # The regex matches the usual markers of a dubbed/multi-audio release
    # (rus dub, MVO/AVO — the standard Russian voice-over abbreviations, dual
    # audio) or literal Cyrillic anywhere in the title, which covers RuTor,
    # NoNaMe Club and BigFANGroup's own title format (e.g. "Матрица / The
    # Matrix"). Guarded by name so re-running never creates a duplicate.
    - name: "Radarr / Sonarr: create the Russian Audio custom format"
      ansible.builtin.uri:
        url: "http://localhost:{{ item.item.port }}/api/{{ item.item.api }}/customformat"
        method: POST
        headers:
          X-Api-Key: "{{ item.item.key }}"
        body_format: json
        body:
          name: Russian Audio
          includeCustomFormatWhenRenaming: false
          specifications:
            - name: Russian audio indicators
              implementation: ReleaseTitleSpecification
              negate: false
              required: false
              fields:
                - { name: value, value: '(?i)(rus\.?dub|dubbed|dual[\s\.\-_]?audio|многоголос|дублир|\bmvo\b|\bavo\b)|[а-яё]' }
        status_code: [200, 201]
      loop: "{{ arr_custom_formats.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: "'Russian Audio' not in (item.json | default([]) | map(attribute='name') | list)"

    # Creating a custom format auto-adds it to every quality profile with a
    # score of 0 (no effect); this re-fetches HD-1080p specifically to raise
    # that to a real bonus. Re-runs are harmless — setting the same score
    # twice changes nothing — so this isn't guarded like a one-shot step.
    - name: "Radarr / Sonarr: fetch the HD-1080p profile to score it"
      ansible.builtin.uri:
        url: "http://localhost:{{ item.port }}/api/{{ item.api }}/qualityprofile"
        headers:
          X-Api-Key: "{{ item.key }}"
        status_code: 200
      register: arr_profiles_for_scoring
      changed_when: false
      loop: *arr_apps
      loop_control:
        label: "{{ item.name }}"

    - name: "Radarr / Sonarr: give Russian-audio releases a score bonus in HD-1080p"
      ansible.builtin.uri:
        url: "http://localhost:{{ item.item.port }}/api/{{ item.item.api }}/qualityprofile/{{ profile.id }}"
        method: PUT
        headers:
          X-Api-Key: "{{ item.item.key }}"
        body_format: json
        # Every other formatItem is carried over unchanged; only the "Russian
        # Audio" one gets its score raised (combine() overlays just the score
        # key, keeping that item's own format/name as-is). upgradeAllowed and
        # cutoffFormatScore are what make Radarr/Sonarr keep searching for a
        # Russian release even after an English one has already been grabbed.
        body: >-
          {{ profile | combine({
               'formatItems': new_format_items,
               'upgradeAllowed': true,
               'cutoffFormatScore': russian_audio_score,
             }) }}
        status_code: [200, 202]
      vars:
        profile: "{{ item.json | selectattr('name', 'equalto', jellyseerr_quality_profile) | first }}"
        new_format_items: >-
          {{ (profile.formatItems | rejectattr('name', 'equalto', 'Russian Audio') | list)
             + [(profile.formatItems | selectattr('name', 'equalto', 'Russian Audio') | first) | combine({'score': russian_audio_score})] }}
      loop: "{{ arr_profiles_for_scoring.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "Jellyseerr: list existing Radarr servers"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyseerr_port }}/api/v1/settings/radarr"
        headers:
          Cookie: "{{ jsr_cookie }}"
        status_code: 200
      register: jsr_radarr_list
      when: jsr_cookie is defined
      changed_when: false
      ignore_errors: true

    # body_format: raw + a Jinja dict literal + to_json, not a plain YAML body:
    # mapping — Ansible's (non-native) Jinja rendering stringifies ANY
    # templated leaf in a YAML structure the moment it's more than a bare
    # variable (an attribute lookup or a filter is enough), so
    # `activeProfileId: "{{ ....id }}"` always ends up as the JSON string "4"
    # rather than the number 4, no matter how many ways you filter/cast it —
    # confirmed by testing `"{{ 4 | int }}"` alone, with nothing else in the
    # expression, which fails exactly the same way. Jellyseerr's schema
    # validator rejects that outright with "should be number". Building the
    # whole dict inside one {{ }} expression keeps every value's real type
    # until to_json serializes the lot in a single pass, which is the only
    # combination that actually round-trips a real integer through Ansible.
    - name: "Jellyseerr: register Radarr as the movie backend"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyseerr_port }}/api/v1/settings/radarr"
        method: POST
        headers:
          Cookie: "{{ jsr_cookie }}"
          Content-Type: application/json
        body_format: raw
        body: >-
          {{ {
               'name': 'Radarr',
               'hostname': 'radarr',
               'port': radarr_port,
               'apiKey': radarr_api_key,
               'useSsl': false,
               'baseUrl': '',
               'activeProfileId': (radarr_quality_profiles.json | selectattr('name', 'equalto', jellyseerr_quality_profile) | first).id,
               'activeProfileName': jellyseerr_quality_profile,
               'activeDirectory': radarr_root,
               'is4k': false,
               'minimumAvailability': 'released',
               'isDefault': true,
               'externalUrl': '',
               'syncEnabled': true,
               'preventSearch': false,
             } | to_json }}
        status_code: [200, 201]
      when:
        - jsr_cookie is defined
        - jsr_radarr_list is succeeded
        - "'Radarr' not in (jsr_radarr_list.json | default([]) | map(attribute='name') | list)"
      ignore_errors: true

    - name: "Jellyseerr: list existing Sonarr servers"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyseerr_port }}/api/v1/settings/sonarr"
        headers:
          Cookie: "{{ jsr_cookie }}"
        status_code: 200
      register: jsr_sonarr_list
      when: jsr_cookie is defined
      changed_when: false
      ignore_errors: true

    # enableSeasonFolders is required by Jellyseerr's schema validation (a plain
    # 400 "should have required property" without it) — it is Sonarr's own
    # "organize episodes into season folders" setting, not something Jellyseerr
    # invented, so true matches how Sonarr lays out {{ sonarr_root }} above.
    # See the comment on the Radarr registration task above for why this is a
    # Jinja dict literal + to_json rather than a plain YAML body: mapping —
    # activeProfileId (and activeLanguageProfileId) have to be real numbers.
    - name: "Jellyseerr: register Sonarr as the TV backend"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyseerr_port }}/api/v1/settings/sonarr"
        method: POST
        headers:
          Cookie: "{{ jsr_cookie }}"
          Content-Type: application/json
        body_format: raw
        body: >-
          {{ {
               'name': 'Sonarr',
               'hostname': 'sonarr',
               'port': sonarr_port,
               'apiKey': sonarr_api_key,
               'useSsl': false,
               'baseUrl': '',
               'activeProfileId': (sonarr_quality_profiles.json | selectattr('name', 'equalto', jellyseerr_quality_profile) | first).id,
               'activeProfileName': jellyseerr_quality_profile,
               'activeDirectory': sonarr_root,
               'activeLanguageProfileId': 1,
               'is4k': false,
               'isDefault': true,
               'externalUrl': '',
               'syncEnabled': true,
               'preventSearch': false,
               'enableSeasonFolders': true,
             } | to_json }}
        status_code: [200, 201]
      when:
        - jsr_cookie is defined
        - jsr_sonarr_list is succeeded
        - "'Sonarr' not in (jsr_sonarr_list.json | default([]) | map(attribute='name') | list)"
      ignore_errors: true

    # Mirrors clicking "Finish" on Jellyseerr's own setup wizard. Skipping this
    # leaves `initialized: false` forever even though Jellyfin/Radarr/Sonarr are
    # genuinely all wired up — Jellyseerr's UI checks that flag on every page
    # load and sends everyone back to the setup wizard until it is set.
    - name: "Jellyseerr: finish setup"
      ansible.builtin.uri:
        url: "http://localhost:{{ jellyseerr_port }}/api/v1/settings/initialize"
        method: POST
        headers:
          Cookie: "{{ jsr_cookie }}"
        status_code: 200
      when:
        - jsr_cookie is defined
        - not (jsr_public.json.initialized | default(false))
      ignore_errors: true

    - name: "Jellyseerr: note if it could not be linked automatically"
      ansible.builtin.debug:
        msg: >-
          Jellyseerr could not be configured over its API. Open
          http://localhost:{{ jellyseerr_port }} and run its setup wizard:
          sign in with the Jellyfin admin account, then add Radarr and Sonarr
          (hostnames `radarr` and `sonarr`, the API keys are in
          config/*/config.xml).
      when: jsr_cookie is not defined

    # ---------- 8c. Recyclarr: sync TRaSH-Guides quality profiles ----------
    #
    # Placed after the Russian Audio custom format above on purpose:
    # recyclarr.yml's reset_unmatched_scores.except list names it by title,
    # so it has to already exist for that exclusion to mean anything — not
    # that it would error either way, but the ordering is what makes the
    # comment in the template ("never touches Russian Audio") actually true
    # from the very first sync instead of the second one.
    #
    # recyclarr itself only runs once and exits; RECYCLARR_CREATE_CONFIG on
    # the container (docker-compose.yml) is what stops it from erroring in
    # the gap between the stack starting (section 1, above) and this
    # template existing. Re-templating on every run and re-running sync here
    # means a `git pull` that changes the trash_id list above (or a TRaSH
    # Guide update upstream) takes effect on the next `make deploy`, not on
    # whatever CRON_SCHEDULE happens to fire next.
    - name: "Recyclarr: write recyclarr.yml"
      ansible.builtin.template:
        src: recyclarr.yml.j2
        dest: "{{ project_dir }}/config/recyclarr/recyclarr.yml"
        mode: "0600"

    - name: "Recyclarr: sync now"
      ansible.builtin.command:
        cmd: docker compose exec -T recyclarr recyclarr sync
        chdir: "{{ project_dir }}"
      register: recyclarr_sync
      changed_when: "'contain quality changes' in recyclarr_sync.stdout or 'contain updated scores' in recyclarr_sync.stdout"
      ignore_errors: true

    - name: "Recyclarr: note if the sync failed"
      ansible.builtin.debug:
        msg: >-
          Recyclarr sync failed — check `make logs S=recyclarr` and
          config/recyclarr/recyclarr.yml on the server. Radarr/Sonarr are
          unaffected either way; this only adds extra quality-profile
          scoring on top of what deploy.yml already configured.
      when: recyclarr_sync is failed

    # ---------- 9. Backups: config/ only, restic, local repo on the server ----------
    #
    # config/ is every service's settings, API keys and watch history — the
    # only state here that isn't trivially replaceable (data/ is just
    # downloaded media; Radarr/Sonarr can re-grab it). This backs it up daily
    # to a restic repo on the server's own disk: it protects against
    # `rm -rf config`, a bad upgrade, or a fat-fingered setting, but NOT
    # against that disk itself dying — restic repos can live on a second disk
    # or a remote just as well (restic.net/docs), point backup_repo_dir at
    # one if you want that later.

    - name: Install restic
      ansible.builtin.apt:
        name: restic
        state: present
        update_cache: true
      become: true

    - name: "Backups: create the repo and script directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ backup_repo_dir }}"
        - "{{ ansible_env.HOME }}/.reelhub"

    # restic's own password, not master_pass: this one is never meant to
    # rotate. restic bakes a repo's password in at `restic init` and has no
    # "change it later" — if this value ever drifts from what a repo was
    # created with, every backup after that silently fails (wrong password),
    # and everything backed up before that becomes unreadable. Keeping it
    # independent of master_pass means renaming your qBittorrent/Jellyfin
    # login never has that side effect.
    - name: "Backups: write the restic repo password"
      ansible.builtin.copy:
        content: "{{ restic_pass }}\n"
        dest: "{{ ansible_env.HOME }}/.reelhub/restic-password"
        mode: "0600"

    - name: "Backups: check whether the restic repo already exists"
      ansible.builtin.command: restic snapshots
      environment:
        RESTIC_REPOSITORY: "{{ backup_repo_dir }}"
        RESTIC_PASSWORD_FILE: "{{ ansible_env.HOME }}/.reelhub/restic-password"
      register: restic_check
      changed_when: false
      failed_when: false

    - name: "Backups: initialize the restic repo"
      ansible.builtin.command: restic init
      environment:
        RESTIC_REPOSITORY: "{{ backup_repo_dir }}"
        RESTIC_PASSWORD_FILE: "{{ ansible_env.HOME }}/.reelhub/restic-password"
      when: restic_check.rc != 0

    - name: "Backups: write the backup script"
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.reelhub/backup-config.sh"
        mode: "0700"
        content: |
          #!/bin/sh
          # Rewritten by `make deploy` every run — edit vars.yml's backup_repo_dir
          # or the retention line below instead of this file directly.
          set -e
          export RESTIC_REPOSITORY="{{ backup_repo_dir }}"
          export RESTIC_PASSWORD_FILE="{{ ansible_env.HOME }}/.reelhub/restic-password"
          restic backup "{{ project_dir }}/config" --tag reelhub
          restic forget --tag reelhub --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune

    - name: "Backups: install the systemd service"
      ansible.builtin.copy:
        dest: /etc/systemd/system/reelhub-backup.service
        mode: "0644"
        content: |
          [Unit]
          Description=Back up Reelhub's config/ with restic

          [Service]
          Type=oneshot
          User={{ ansible_user }}
          ExecStart={{ ansible_env.HOME }}/.reelhub/backup-config.sh
      become: true
      register: backup_service_unit

    - name: "Backups: install the systemd timer (daily)"
      ansible.builtin.copy:
        dest: /etc/systemd/system/reelhub-backup.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Daily Reelhub config backup

          [Timer]
          OnCalendar=daily
          Persistent=true

          [Install]
          WantedBy=timers.target
      become: true
      register: backup_timer_unit

    - name: "Backups: reload systemd after a unit change"
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      when: backup_service_unit is changed or backup_timer_unit is changed

    - name: "Backups: enable and start the timer"
      ansible.builtin.systemd:
        name: reelhub-backup.timer
        enabled: true
        state: started
      become: true

    # ---------- 10. Summary ----------

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "qBittorrent  http://localhost:{{ qbt_web_port }}   user {{ qbt_new_user }} / password in ansible/vars.yml"
          - "Prowlarr     http://localhost:{{ prowlarr_port }}   <- START HERE: add your indexers, they sync to Radarr/Sonarr"
          - "Radarr       http://localhost:{{ radarr_port }}"
          - "Sonarr       http://localhost:{{ sonarr_port }}"
          - "Jellyfin     http://localhost:{{ jellyfin_port }}   user {{ jellyfin_admin_user }} / password in ansible/vars.yml"
          - "Jellyseerr   http://localhost:{{ jellyseerr_port }}"
          - ""
          - "config/ now backs up nightly to {{ backup_repo_dir }} (restic). Restore with:"
          - "  RESTIC_REPOSITORY={{ backup_repo_dir }} RESTIC_PASSWORD_FILE=~/.reelhub/restic-password restic restore latest --target /path/to/restore"
          - ""
          - "Any task above marked 'failed (ignored)' is a Jellyfin/Jellyseerr step you"
          - "should finish in the browser. Everything else is configured."
