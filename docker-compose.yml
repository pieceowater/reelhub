# Reelhub — the nine services. See README.md for what each one does.
#
# Two conventions hold this together:
#
#   1. Every service that touches media mounts the same ./data directory at the
#      same path (/data). qBittorrent downloads to /data/downloads and Radarr and
#      Sonarr import into /data/media — one filesystem, so finished downloads are
#      moved instantly instead of copied.
#
#   2. Services reach each other by compose service name (http://radarr:7878),
#      not localhost. The published ports below are only for you, from the host.
#
# PUID/PGID/TZ come from .env if present, otherwise the defaults here apply.
#
# Every image is pinned to an exact version, deliberately. Running `:latest` here
# means an unrelated `docker compose pull` can swap a service for a new major
# release overnight and break the wiring — that is not theoretical, it is how
# this stack broke while it was being built: qBittorrent 5 renamed its session
# cookie, and Jellyfin 12 removed the auth header Jellyseerr uses. Pinned tags
# mean the stack keeps working untouched.
#
# To move a service up, change its tag here and run `make pull`, one at a time so
# you know what changed if something breaks.

name: reelhub

x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Asia/Almaty}

services:
  # Torrent client. 6881 is the BitTorrent peer port and needs to be reachable
  # for decent speeds; 8080 is the Web UI the playbook configures over its API.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ./config/qbittorrent:/config
      - ./data:/data
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks:
      - media

  # Solves the Cloudflare JS challenge that sits in front of some indexers
  # (1337x, EZTV, the KickassTorrents mirrors — see README, these were left
  # out of the default indexer list until now for exactly this reason).
  # Prowlarr calls it directly; nothing else in the stack talks to it.
  flaresolverr:
    image: flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    environment:
      TZ: ${TZ:-Asia/Almaty}
    ports:
      - "8191:8191"
    restart: unless-stopped
    networks:
      - media

  # Indexer manager. Add trackers here once; it pushes them to Radarr and Sonarr.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - media

  # Movies: searches indexers, sends grabs to qBittorrent, imports into
  # /data/media/movies with proper names Jellyfin can match.
  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr
    environment:
      <<: *common-env
    volumes:
      - ./config/radarr:/config
      - ./data:/data
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - media

  # TV: same as Radarr, plus it tracks seasons and watches for new episodes.
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    environment:
      <<: *common-env
    volumes:
      - ./config/sonarr:/config
      - ./data:/data
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - media

  # Media server. Only needs ./data/media — it never sees in-progress downloads.
  #
  # Held on 10.x on purpose. Jellyfin 12 dropped the X-Emby-Authorization header,
  # and Jellyseerr still signs in with it — on :latest (12.x) Jellyseerr cannot
  # authenticate at all and the request flow is dead. Once Jellyseerr supports 12,
  # this can move up.
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11
    container_name: jellyfin
    environment:
      <<: *common-env
    volumes:
      - ./config/jellyfin:/config
      - ./data/media:/data/media
    # Intel Quick Sync (VAAPI) hardware transcoding — the deploy playbook
    # turns this on in Jellyfin's own settings once this device exists.
    # Requires the server to actually have /dev/dri (an Intel iGPU): Docker
    # refuses to start the container at all if this path doesn't exist on the
    # host, so remove this `devices:` block if you ever move the stack to a
    # server without one.
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8096:8096"
    restart: unless-stopped
    networks:
      - media

  # Request front-end. Talks only to the other services' APIs, so it needs no
  # media mounts at all.
  jellyseerr:
    image: fallenbagel/jellyseerr:2.7.3
    container_name: jellyseerr
    environment:
      TZ: ${TZ:-Asia/Almaty}
    volumes:
      - ./config/jellyseerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped
    networks:
      - media

  # Subtitles for Radarr/Sonarr's library — watches the same data/media tree
  # Jellyfin reads and fetches matching Russian/English subs next to each
  # video file.
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    environment:
      <<: *common-env
    volumes:
      - ./config/bazarr:/config
      - ./data/media:/data/media
    ports:
      - "6767:6767"
    restart: unless-stopped
    networks:
      - media

  # Syncs Radarr/Sonarr's HD-1080p quality profile against TRaSH-Guides'
  # curated custom formats (junk-release filtering, release-group cleanup) on
  # CRON_SCHEDULE. Deliberately never touches the hand-made "Russian Audio"
  # custom format's score — see ansible/deploy.yml and config/recyclarr's
  # recyclarr.yml, which the playbook generates, for why that's safe.
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.7.2
    container_name: recyclarr
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Asia/Almaty}
      CRON_SCHEDULE: "@daily"
      # `docker compose up -d` starts this before deploy.yml has generated
      # the real recyclarr.yml (it needs Radarr/Sonarr's API keys, which
      # aren't known until later in the playbook) — without this, recyclarr
      # errors out and restart-loops in that gap instead of just waiting.
      RECYCLARR_CREATE_CONFIG: "true"
    volumes:
      - ./config/recyclarr:/config
    restart: unless-stopped
    networks:
      - media

networks:
  media:
    driver: bridge
